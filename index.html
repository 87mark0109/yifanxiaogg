<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
<body>

<canvas id="myChart" style="width:100%;max-width:600px"></canvas>

<script>
const xValues = ["顏值評分", "猴子程度", "屁孩", "壓彎程度", "穩重指數"];
const yValues = [0, 100, 87, 1, 99];
const barColors = ["red", "green","blue","orange","red"];

const ctx = document.getElementById('myChart');

new Chart(ctx, {
  type: "bar",
  data: {
    labels: xValues,
    datasets: [{
      backgroundColor: barColors,
      data: yValues
    }]
  },
  options: {
    plugins: {
      legend: {display: false},
      title: {
        display: true,
        text: "穩重哥評分",
        font: {size: 16}
      }
    }
  }
});
</script>
